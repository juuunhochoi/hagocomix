<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>하만전 부스 안내도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 상단 검색 패널 -->
  <header class="search-panel" id="searchPanel">
    <div class="search-row">
    <button type="button" class="star fav-btn" id="favBtn" aria-label="즐겨찾기 목록" aria-pressed="false" aria-controls="favPanel"></button>
    <label class="search-box">
      <span class="search-label">검색</span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
             placeholder="작가, 작품, 부스명, 번호"
             aria-label="작가, 작품, 부스명 검색" aria-controls="results" aria-expanded="false" />
      <button class="clear-btn" id="clearBtn" type="button" aria-label="검색어 지우기" hidden>×</button>
    </label>
    </div>
    <ul class="results" id="results" role="listbox" hidden></ul>
  </header>

  <!-- 지도 -->
  <main class="map-viewport" id="mapViewport">
    <div class="map-inner" id="mapInner">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="부스 안내도"></svg>
    </div>
  </main>

  <!-- 지도 컨트롤 -->
  <div class="map-controls" id="mapControls">
    <button type="button" id="zoomIn" aria-label="확대">+</button>
    <button type="button" id="zoomOut" aria-label="축소">−</button>
    <button type="button" id="zoomFit" aria-label="전체 보기">⤢</button>
  </div>

  <!-- 즐겨찾기 사이드바 -->
  <div class="sb-backdrop" id="favBackdrop" hidden></div>
  <aside class="sidebar" id="favPanel" aria-hidden="true" aria-label="즐겨찾기">
    <div class="sb-head">
      <button type="button" class="sb-save" id="favSave">사진으로 내려받기</button>
      <button type="button" class="sb-close" id="favClose" aria-label="닫기">×</button>
    </div>
    <div class="sb-body" id="favList"></div>
  </aside>

  <!-- 하단 부스 상세 시트 -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle" id="sheetHandle"><span></span></div>
    <div class="sheet-head">
      <div class="avatar" id="sheetAvatar"></div>
      <p class="sheet-title" id="sheetTitle"></p>
      <a class="sheet-link" id="sheetLink" target="_blank" rel="noopener" hidden>소개 ↗</a>
      <button type="button" class="star" id="boothStar" aria-label="부스 즐겨찾기" aria-pressed="false"></button>
    </div>
    <div class="works" id="works"></div>
  </section>

  <script src="map.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
